<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#060816" />
    <title>PulseChat</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        line-height: 1.5;
        font-weight: 400;
        background: #060816;
        color: #f5f7ff;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at top, #182245, #060816 60%);
        color: #f5f7ff;
      }
      button, input { font: inherit; }
      button { cursor: pointer; }
      #app { min-height: 100vh; }
      .app-shell { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
      .auth-card, .sidebar, .chat-panel, .loading-card {
        background: rgba(6, 12, 31, 0.84);
        backdrop-filter: blur(24px);
        border: 1px solid rgba(255,255,255,0.08);
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
      }
      .auth-card { width: min(100%, 430px); padding: 32px; border-radius: 24px; }
      .brand-block { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
      .brand-mark { width: 48px; height: 48px; display: grid; place-items: center; background: linear-gradient(145deg, #7c6cf7, #24c0cb); border-radius: 14px; font-size: 24px; }
      .eyebrow { text-transform: uppercase; letter-spacing: 0.24em; font-size: 0.74rem; color: #86a3ff; margin: 0 0 6px; }
      h1, h2, h3, p { margin: 0; }
      .toggle-row { display: flex; gap: 10px; margin: 18px 0; }
      .toggle { flex: 1; padding: 10px 12px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.1); background: transparent; color: #e2e8ff; }
      .toggle.active, .primary-btn { background: linear-gradient(135deg, #7c6cf7, #24c0cb); color: white; border: none; }
      .auth-form { display: grid; gap: 12px; }
      label { display: grid; gap: 6px; color: #cdd6ff; font-size: 0.95rem; }
      input { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.06); color: white; }
      input::placeholder { color: #8ea0d3; }
      .primary-btn { padding: 12px 14px; border-radius: 12px; font-weight: 700; }
      .status { margin-top: 10px; font-size: 0.92rem; }
      .error { color: #ff8a8a; }
      .success { color: #7ee3b4; }
      .helper-text { margin-top: 12px; color: #97a2c6; font-size: 0.92rem; }
      .dashboard-shell { align-items: flex-start; padding: 18px; }
      .sidebar { width: min(100%, 360px); border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 16px; position: sticky; top: 18px; max-height: calc(100vh - 36px); overflow: auto; }
      .profile-card { display: flex; gap: 12px; align-items: center; padding: 14px; border-radius: 16px; background: rgba(255,255,255,0.04); }
      .profile-card.clickable { cursor: pointer; transition: transform 160ms ease, background 160ms ease; }
      .profile-card.clickable:hover { transform: translateY(-1px); background: rgba(255,255,255,0.07); }
      .profile-page { width: min(100%, 860px); max-height: calc(100vh - 40px); overflow: auto; padding: 24px; border-radius: 24px; background: rgba(6, 12, 31, 0.95); border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 24px 70px rgba(0,0,0,0.35); color: #f4f7ff; }
      .profile-hero { display: flex; gap: 20px; align-items: center; margin-bottom: 20px; flex-wrap: wrap; }
      .profile-hero .avatar { width: 88px; height: 88px; font-size: 1.4rem; }
      .profile-badge { display: inline-flex; align-items: center; gap: 8px; margin-top: 8px; padding: 8px 12px; border-radius: 999px; background: rgba(36,192,203,0.16); color: #86f3ff; font-size: 0.9rem; }
      .profile-grid { display: grid; gap: 16px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .profile-card-panel { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 16px; }
      .profile-list { display: grid; gap: 8px; margin-top: 10px; }
      .profile-list li { color: #dce6ff; line-height: 1.6; }
      .profile-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
      .profile-tags span { padding: 8px 10px; border-radius: 999px; background: rgba(124,108,247,0.2); color: #d8d2ff; font-size: 0.9rem; }
      .profile-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
      @media (max-width: 700px) { .profile-grid { grid-template-columns: 1fr; } }
      .avatar { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: white; overflow: hidden; }
      .avatar.small { width: 40px; height: 40px; font-size: 0.9rem; }
      .avatar img { width: 100%; height: 100%; object-fit: cover; }
      .online-pill { display: inline-flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 0.8rem; color: #7ee3b4; }
      .online-pill::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: #3ee98f; box-shadow: 0 0 0 4px rgba(62, 233, 143, 0.2); display: inline-block; }
      .section-header { display: flex; justify-content: space-between; align-items: center; }
      .ghost-btn { background: transparent; border: 1px solid rgba(255,255,255,0.12); color: #dce4ff; padding: 8px 10px; border-radius: 999px; }
      .contact-list { display: flex; flex-direction: column; gap: 10px; overflow: auto; padding-right: 2px; }
      .room-row { position: relative; display: flex; align-items: center; gap: 8px; min-height: 72px; }
      .contact-card { border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.03); color: inherit; padding: 10px; border-radius: 14px; display: flex; gap: 10px; align-items: center; text-align: left; flex: 1; min-height: 72px; max-height: 72px; overflow: hidden; }
      .contact-card.active { border-color: #7c6cf7; background: rgba(124,108,247,0.16); }
      .room-menu-wrapper { position: relative; flex-shrink: 0; }
      .room-menu-btn { width: 36px; height: 36px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.04); color: #f2f5ff; font-size: 1.1rem; line-height: 1; }
      .chat-menu { position: absolute; right: 0; top: calc(100% + 6px); min-width: 140px; display: flex; flex-direction: column; gap: 6px; padding: 8px; background: rgba(8, 14, 33, 0.96); border: 1px solid rgba(255,255,255,0.12); border-radius: 12px; box-shadow: 0 12px 30px rgba(0,0,0,0.28); z-index: 10; }
      .chat-menu button { border: 0; background: transparent; color: #f3f6ff; padding: 8px 10px; border-radius: 8px; text-align: left; }
      .chat-menu button:hover { background: rgba(255,255,255,0.08); }
      .chat-menu .menu-danger { color: #ff8a8a; }
      .contact-body { flex: 1; min-width: 0; }
      .contact-topline { display: flex; justify-content: space-between; gap: 10px; font-size: 0.95rem; }
      .contact-body p { color: #9da8cf; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .chat-panel { flex: 1; width: min(100%, 860px); max-width: 860px; border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 16px; height: calc(100vh - 36px); margin-left: 16px; overflow: hidden; position: relative; }
      .chat-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.08); gap: 12px; }
      .header-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
      .composer { position: sticky; bottom: 0; display: flex; flex-direction: column; gap: 10px; background: rgba(6, 12, 31, 0.96); padding-top: 10px; padding-bottom: 8px; z-index: 1; }
      .header-badge { padding: 7px 12px; border-radius: 999px; background: rgba(36,192,203,0.16); color: #86f3ff; font-size: 0.9rem; }
      .room-subtitle { color: #94a0c4; font-size: 0.92rem; margin-top: 4px; }
      .detective-controls { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.04); color: #e7ecff; }
      .detective-controls select { border: 0; background: transparent; color: #f5f7ff; outline: none; }
      .detective-active { border-color: #24c0cb; color: #86f3ff; }
      .bubble-footer { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
      .delete-btn { border: 0; background: rgba(255,255,255,0.16); color: white; border-radius: 999px; padding: 4px 8px; font-size: 0.75rem; }
      .modal-backdrop { position: fixed; inset: 0; background: rgba(3, 6, 16, 0.78); display: grid; place-items: center; padding: 20px; z-index: 40; }
      .modal-card { width: min(100%, 540px); background: rgba(8, 14, 33, 0.96); border: 1px solid rgba(255,255,255,0.12); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
      .modal-header { display: flex; justify-content: space-between; align-items: center; }
      .modal-help { color: #9da8cf; font-size: 0.92rem; }
      .member-picker { display: grid; gap: 8px; max-height: 220px; overflow: auto; padding-right: 4px; }
      .member-option { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.04); color: #f2f5ff; }
      .member-option.selected { border-color: #24c0cb; background: rgba(36,192,203,0.14); }
      .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 6px; }
      .message-list { flex: 1; overflow: auto; display: flex; flex-direction: column; gap: 10px; padding-right: 4px; padding-bottom: 10px; }
      .message-row { display: flex; }
      .message-row.mine { justify-content: flex-end; }
      .bubble { max-width: min(78%, 520px); background: rgba(255,255,255,0.08); border-radius: 16px 16px 16px 6px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; overflow-wrap: break-word; word-break: break-word; }
      .bubble.mine { background: linear-gradient(135deg, rgba(124,108,247,0.95), rgba(36,192,203,0.86)); border-radius: 16px 16px 6px 16px; }
      .bubble p { color: #f9fbff; margin: 0; white-space: pre-wrap; overflow-wrap: break-word; word-break: break-word; }
      .bubble img { width: 100%; max-height: 220px; object-fit: cover; border-radius: 12px; }
      .sender-name { font-size: 0.78rem; font-weight: 700; color: #dce8ff; margin-bottom: 2px; }
      .bubble span { font-size: 0.75rem; color: rgba(255,255,255,0.72); align-self: flex-end; }
      .typing-bubble { flex-direction: row; gap: 6px; align-items: center; padding: 12px; }
      .typing-bubble span { width: 8px; height: 8px; border-radius: 50%; background: white; display: inline-block; animation: pulse 1s infinite ease-in-out; }
      .typing-bubble span:nth-child(2) { animation-delay: 0.2s; }
      .typing-bubble span:nth-child(3) { animation-delay: 0.4s; }
      @keyframes pulse { 0%,80%,100% { transform: scale(0.8); opacity: 0.5; } 40% { transform: scale(1.1); opacity: 1; } }
      .composer { display: flex; flex-direction: column; gap: 10px; }
      .input-row { display: flex; gap: 10px; align-items: center; }
      .input-row input { flex: 1; }
      .upload-btn { display: inline-flex; align-items: center; justify-content: center; border-radius: 12px; border: 1px solid rgba(255,255,255,0.13); padding: 10px 12px; color: #dfe7ff; background: rgba(255,255,255,0.04); }
      .upload-btn input { display: none; }
      .preview-card { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 8px 10px; }
      .preview-card img { width: 60px; height: 60px; object-fit: cover; border-radius: 10px; }
      .empty-state { color: #94a0c4; padding: 24px 0; text-align: center; }
      @media (max-width: 900px) {
        .dashboard-shell { flex-direction: column; }
        .sidebar { width: 100%; }
        .chat-panel { margin-left: 0; min-height: unset; }
      }
      @media (max-width: 620px) {
        .auth-card { padding: 24px; }
        .input-row { flex-wrap: wrap; }
        .input-row > * { flex: 1 1 100%; }
        .chat-header { flex-direction: column; align-items: flex-start; gap: 8px; }
        .bubble { max-width: 100%; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
    <script>
      const STORAGE_KEY = 'pulsechat-state-v1';
      const firebaseConfig = {
        apiKey: "AIzaSyBBdWdwBh1QVZ8Cjqayj4nJBtHuzeyHl2Q",
        authDomain: "chattify-d2431.firebaseapp.com",
        databaseURL: "https://chattify-d2431-default-rtdb.asia-southeast1.firebasedatabase.app/",
        projectId: "chattify-d2431",
        storageBucket: "chattify-d2431.firebasestorage.app",
        messagingSenderId: "20850150249",
        appId: "1:20850150249:web:92d64b1c00ac68f8fe0bf8",
        measurementId: "G-NJTHTJ8DM5"
      };
      const demoUsers = [];

      function createId(prefix) {
        return `${prefix}-${Math.random().toString(36).slice(2, 10)}`;
      }
      function getInitials(name) {
        return name.split(' ').slice(0, 2).map((part) => part[0]).join('').toUpperCase();
      }
      function formatTime(timestamp) {
        return new Date(timestamp).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
      }

      function isHiddenContact(user) {
        const hiddenNames = ['ava chen', 'noah singh', 'mina alvarez'];
        const name = String(user?.name || '').trim().toLowerCase();
        return hiddenNames.some((hiddenName) => name.includes(hiddenName));
      }

      const state = {
        authReady: false,
        authLoading: false,
        authError: '',
        authMessage: '',
        profileOpen: false,
        profileUserId: null,
        users: [],
        currentUser: null,
        conversations: {},
        roomMeta: {},
        activeContactId: null,
        activeRoomKey: null,
        draft: '',
        error: '',
        selectedImage: '',
        groupModalOpen: false,
        groupName: '',
        selectedGroupMembers: [],
        detectiveMode: false,
        impersonatedUserId: null,
        discoverQuery: '',
        friends: [],
        friendRequests: [],
        renameModalOpen: false,
        renameTargetRoomKey: null,
        renameDraft: '',
        activeRoomMenuKey: null,
      };
      let hasSyncedConversations = false;
      const audioContext = new (window.AudioContext || window.webkitAudioContext)();

      function playNotificationSound(type = 'send') {
        if (!audioContext) return;
        const frequency = type === 'receive' ? 520 : 760;
        const duration = type === 'receive' ? 0.12 : 0.08;
        const gainNode = audioContext.createGain();
        const oscillator = audioContext.createOscillator();

        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(frequency, audioContext.currentTime);
        gainNode.gain.setValueAtTime(0.14, audioContext.currentTime);

        oscillator.connect(gainNode);
        gainNode.connect(audioContext.destination);

        if (audioContext.state === 'suspended') {
          audioContext.resume();
        }

        oscillator.start();
        oscillator.stop(audioContext.currentTime + duration);
      }

      const app = document.getElementById('app');
      let firebaseAuth = null;
      let firebaseDatabase = null;
      let usersSyncRef = null;
      let conversationsSyncRef = null;
      let roomMetaSyncRef = null;

      function normalizeUser(user) {
        return {
          id: user.uid,
          uid: user.uid,
          name: user.displayName || user.email?.split('@')[0] || 'Google User',
          email: user.email || '',
          photoURL: user.photoURL || '',
          role: 'Authenticated with Google',
          color: '#7c6cf7',
        };
      }

      function upsertUser(user) {
        const normalized = normalizeUser(user);
        const existingIndex = state.users.findIndex((entry) => entry.id === normalized.id || entry.email === normalized.email);
        if (existingIndex >= 0) {
          state.users[existingIndex] = { ...state.users[existingIndex], ...normalized, rooms: state.users[existingIndex].rooms || [] };
          return state.users[existingIndex];
        }
        state.users = [...state.users, { ...normalized, rooms: [] }];
        return normalized;
      }

      function mapAuthError(error) {
        if (error?.code === 'auth/popup-blocked') {
          return 'The sign-in popup was blocked. Please allow popups and try again.';
        }
        if (error?.code === 'auth/popup-closed-by-user') {
          return 'Google sign-in was cancelled.';
        }
        if (error?.code === 'auth/network-request-failed') {
          return 'Network issue detected. Please check your connection and try again.';
        }
        return error?.message || 'Google sign-in failed.';
      }

      function persist() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          users: state.users,
          conversations: state.conversations,
          roomMeta: state.roomMeta,
          activeContactId: state.activeContactId,
          activeRoomKey: state.activeRoomKey,
          friends: state.friends,
          friendRequests: state.friendRequests,
        }));
      }

      function syncUsersFromDatabase() {
        if (!firebaseDatabase) return;
        if (usersSyncRef) {
          firebaseDatabase.ref('users').off('value', usersSyncRef);
        }

        usersSyncRef = (snapshot) => {
          const values = snapshot.val() || {};
          const remoteUsers = Object.values(values).filter(Boolean);
          const mergedUsers = [...state.users];

          remoteUsers.forEach((entry) => {
            const normalized = {
              ...entry,
              id: entry.id || entry.uid || entry.email,
              uid: entry.uid || entry.id || entry.email,
              name: entry.name || entry.email?.split('@')[0] || 'Google User',
              email: entry.email || '',
              photoURL: entry.photoURL || '',
              role: entry.role || 'Authenticated with Google',
              color: entry.color || '#7c6cf7',
              rooms: entry.rooms || [],
            };

            const existingIndex = mergedUsers.findIndex((user) => user.id === normalized.id || user.email === normalized.email);
            if (existingIndex >= 0) {
              mergedUsers[existingIndex] = {
                ...mergedUsers[existingIndex],
                ...normalized,
                rooms: normalized.rooms || mergedUsers[existingIndex].rooms || [],
              };
            } else {
              mergedUsers.push(normalized);
            }
          });

          state.users = mergedUsers.filter((user) => !isHiddenContact(user));
          if (state.currentUser) {
            const refreshed = state.users.find((user) => user.id === state.currentUser.id || user.email === state.currentUser.email);
            if (refreshed) {
              state.currentUser = refreshed;
            }
          }
          persist();
          render();
        };

        firebaseDatabase.ref('users').on('value', usersSyncRef);
      }

      function writeCurrentUserToDatabase(user) {
        if (!firebaseDatabase || !user) return;
        const userRef = firebaseDatabase.ref(`users/${user.id}`);
        userRef.set({
          ...user,
          lastSeen: Date.now(),
        });
        userRef.onDisconnect().remove();
      }

      function syncRoomMetaFromDatabase() {
        if (!firebaseDatabase) return;
        if (roomMetaSyncRef) {
          firebaseDatabase.ref('roomMeta').off('value', roomMetaSyncRef);
        }

        roomMetaSyncRef = (snapshot) => {
          const values = snapshot.val() || {};
          const normalizedRoomMeta = {};

          Object.entries(values).forEach(([roomKey, meta]) => {
            if (!meta) return;
            normalizedRoomMeta[roomKey] = meta;
          });

          state.roomMeta = normalizedRoomMeta;
          persist();
          render();
        };

        firebaseDatabase.ref('roomMeta').on('value', roomMetaSyncRef);
      }

      function syncConversationsFromDatabase() {
        if (!firebaseDatabase) return;
        if (conversationsSyncRef) {
          firebaseDatabase.ref('conversations').off('value', conversationsSyncRef);
        }

        conversationsSyncRef = (snapshot) => {
          const rooms = snapshot.val() || {};
          const normalizedConversations = {};
          const previousConversations = state.conversations || {};
          let shouldPlayReceive = false;

          Object.entries(rooms).forEach(([roomKey, roomMessages]) => {
            if (!roomMessages) return;
            const messages = Array.isArray(roomMessages)
              ? roomMessages
              : Object.values(roomMessages).filter(Boolean);
            normalizedConversations[roomKey] = messages.sort((a, b) => (a.createdAt || '').localeCompare(b.createdAt || ''));

            const previousMessages = previousConversations[roomKey] || [];
            if (hasSyncedConversations && state.currentUser && normalizedConversations[roomKey].length > previousMessages.length) {
              const newMessages = normalizedConversations[roomKey].slice(previousMessages.length);
              if (newMessages.some((msg) => msg.senderId !== state.currentUser.id)) {
                shouldPlayReceive = true;
              }
            }
          });

          state.conversations = normalizedConversations;
          persist();
          render();
          if (shouldPlayReceive) {
            playNotificationSound('receive');
          }
          hasSyncedConversations = true;
        };

        firebaseDatabase.ref('conversations').on('value', conversationsSyncRef);
      }

      function render() {
        if (!state.authReady) {
          app.innerHTML = '<div class="app-shell"><div class="loading-card">Preparing PulseChat…</div></div>';
          return;
        }

        if (!state.currentUser) {
          app.innerHTML = `
            <div class="app-shell auth-shell">
              <div class="auth-card">
                <div class="brand-block">
                  <div class="brand-mark">✦</div>
                  <div>
                    <p class="eyebrow">Secure access</p>
                    <h1>PulseChat</h1>
                  </div>
                </div>
                <p class="helper-text">Sign in with your Google account to unlock the chat dashboard. Firebase Authentication handles your identity securely.</p>
                <button class="primary-btn" id="google-login" type="button">${state.authLoading ? 'Signing in…' : 'Continue with Google'}</button>
                ${state.authError ? `<p class="status error">${state.authError}</p>` : ''}
                ${state.authMessage ? `<p class="status success">${state.authMessage}</p>` : ''}
                <p class="helper-text">Replace the placeholder Firebase settings in this file with your project values before testing the login flow.</p>
              </div>
            </div>`;

          document.getElementById('google-login').addEventListener('click', handleGoogleLogin);
          return;
        }

        if (state.profileOpen) {
          const profileUser = state.users.find((user) => user.id === state.profileUserId) || state.currentUser;
          const profileName = profileUser?.name || 'Profile';
          const profileRole = profileUser?.role || 'Member';
          const profileInitials = getInitials(profileName);
          const bjjNote = 'Only you and Connor Student do Brazilian Jiu-Jitsu.';
          app.innerHTML = `
            <div class="app-shell">
              <div class="profile-page">
                <div class="profile-hero">
                  <div class="avatar" style="background:${profileUser?.color || '#7c6cf7'}">${profileUser?.photoURL ? `<img src="${profileUser.photoURL}" alt="${profileName}">` : profileInitials}</div>
                  <div>
                    <p class="eyebrow">Profile page</p>
                    <h1>${profileName}</h1>
                    <p>${profileRole}</p>
                    <div class="profile-badge">🌟 ${profileName === state.currentUser?.name ? 'Your profile' : 'Contact profile'}</div>
                  </div>
                </div>
                <div class="profile-grid">
                  <div class="profile-card-panel">
                    <h3>About</h3>
                    <p style="margin-top:8px; color:#dce6ff; line-height:1.7;">${profileName === state.currentUser?.name ? 'This is your personal profile page with your favorite activities and achievements.' : `This is ${profileName}'s profile page.`}</p>
                  </div>
                  <div class="profile-card-panel">
                    <h3>Highlights</h3>
                    <div class="profile-tags">
                      <span>🎮 Roblox</span>
                      <span>🥋 Brazilian Jiu-Jitsu</span>
                      <span>💬 Chatting</span>
                    </div>
                  </div>
                  <div class="profile-card-panel">
                    <h3>Activities</h3>
                    <ul class="profile-list">
                      <li>🎮 Loves gaming and connecting with friends</li>
                      <li>🗣️ Enjoys chatting in group rooms</li>
                      <li>⭐ Active in PulseChat</li>
                    </ul>
                  </div>
                  <div class="profile-card-panel">
                    <h3>Quick note</h3>
                    <p style="margin-top:8px; color:#dce6ff; line-height:1.7;">${profileName === state.currentUser?.name ? `${bjjNote} You can come back here anytime from your profile card.` : `${bjjNote} You can view ${profileName}'s shared details here.`}</p>
                  </div>
                </div>
                <div class="profile-actions">
                  <button class="ghost-btn" id="close-profile-page" type="button">Back</button>
                </div>
              </div>
            </div>`;

          document.getElementById('close-profile-page').addEventListener('click', () => {
            state.profileOpen = false;
            state.profileUserId = null;
            render();
          });
          return;
        }

        const contacts = state.users.filter((user) => user.id !== state.currentUser.id);
        const joinedRoomKeys = new Set(state.currentUser.rooms || []);
        const activeContact = contacts.find((contact) => contact.id === state.activeContactId) || contacts[0] || null;
        const directRoomKey = activeContact ? [state.currentUser.id, activeContact.id].sort().join('-') : null;
        const roomEntries = [
          ...contacts.map((contact) => {
            const roomKey = [state.currentUser.id, contact.id].sort().join('-');
            const roomMeta = state.roomMeta[roomKey] || { type: 'direct', name: contact.name, memberIds: [state.currentUser.id, contact.id] };
            return { roomKey, type: roomMeta.type || 'direct', name: roomMeta.name || contact.name, memberIds: roomMeta.memberIds || [state.currentUser.id, contact.id], contactId: contact.id };
          }),
          ...Object.entries(state.roomMeta)
            .filter(([, meta]) => meta.type === 'group')
            .filter(([roomKey]) => {
              const memberIds = state.roomMeta[roomKey]?.memberIds || [];
              const hasMembership = memberIds.includes(state.currentUser.id) || joinedRoomKeys.has(roomKey);
              return hasMembership;
            })
            .map(([roomKey, meta]) => ({ roomKey, type: 'group', name: meta.name || 'New group', memberIds: meta.memberIds || [], contactId: null }))
        ];
        const activeRoomKey = state.activeRoomKey || directRoomKey;
        const activeRoom = roomEntries.find((room) => room.roomKey === activeRoomKey) || roomEntries[0] || null;
        const messages = activeRoom ? state.conversations[activeRoom.roomKey] || [] : [];

        app.innerHTML = `
          <div class="app-shell dashboard-shell">
            <aside class="sidebar">
              <div class="profile-card clickable" id="open-profile-page">
                <div class="avatar" style="background:${state.currentUser.color}">
                  ${state.currentUser.photoURL ? `<img src="${state.currentUser.photoURL}" alt="${state.currentUser.name}">` : getInitials(state.currentUser.name)}
                </div>
                <div>
                  <h2>${state.currentUser.name}</h2>
                  <p>${state.currentUser.email}</p>
                  <p>${state.currentUser.role}</p>
                  <span class="online-pill">Currently active on PulseChat</span>
                </div>
              </div>
              <div class="section-header">
                <h3>Active rooms</h3>
                <button class="ghost-btn" id="logout">Logout</button>
              </div>
              <div class="contact-list">
                ${roomEntries.map((room) => {
                  const roomMessages = state.conversations[room.roomKey] || [];
                  const lastMessage = roomMessages[roomMessages.length - 1];
                  const isActive = activeRoom && room.roomKey === activeRoom.roomKey;
                  const roomColor = room.type === 'group' ? '#24c0cb' : '#7c6cf7';
                  return `
                    <div class="room-row">
                      <button class="contact-card ${isActive ? 'active' : ''}" data-room="${room.roomKey}" data-contact="${room.contactId || ''}" data-profile-user="${room.contactId || state.currentUser.id}">
                        <div class="avatar small" style="background:${roomColor}">${getInitials(room.name)}</div>
                        <div class="contact-body">
                          <div class="contact-topline"><strong>${room.name}</strong><span>${lastMessage ? formatTime(lastMessage.createdAt) : 'Now'}</span></div>
                          <p>${room.type === 'group' ? `${room.memberIds.length} members` : (lastMessage?.text || 'Start a fresh conversation')}</p>
                        </div>
                      </button>
                      <div class="room-menu-wrapper">
                        <button class="room-menu-btn" type="button" data-room-menu-toggle="${room.roomKey}" aria-label="Chat options">⋯</button>
                        ${state.activeRoomMenuKey === room.roomKey ? `
                          <div class="chat-menu">
                            <button type="button" data-room-rename="${room.roomKey}">Rename</button>
                            <button type="button" data-room-pin="${room.roomKey}">Pin chat</button>
                            <button type="button" class="menu-danger" data-room-delete="${room.roomKey}">Delete</button>
                          </div>` : ''}
                      </div>
                    </div>`;
                }).join('')}
              </div>
            </aside>
            <main class="chat-panel">
              <header class="chat-header">
                <div>
                  <p class="eyebrow">${activeRoom?.type === 'group' ? 'Group chat' : 'Direct message'}</p>
                  <h2>${activeRoom ? activeRoom.name : 'Select a room'}</h2>
                  ${activeRoom?.type === 'group' ? `<p class="room-subtitle">${activeRoom.memberIds.map((memberId) => state.users.find((user) => user.id === memberId)?.name).filter(Boolean).join(', ')}</p>` : ''}
                </div>
                <div class="header-actions">
                  <button class="ghost-btn" id="select-accounts" type="button">Create Group</button>
                  <div class="header-badge">Live • Protected</div>
                </div>
              </header>
              <div class="message-list">
                ${activeRoom ? messages.map((message) => {
                  const mine = message.senderId === state.currentUser.id;
                  const sender = state.users.find((user) => user.id === message.senderId);
                  const senderLabel = sender?.name || 'Unknown account';
                  return `<div class="message-row ${mine ? 'mine' : ''}"><div class="bubble ${mine ? 'mine' : ''}">${!mine ? `<div class="sender-name">${senderLabel}</div>` : ''}${message.text ? `<p>${message.text}</p>` : ''}${message.image ? `<img src="${message.image}" alt="Shared content">` : ''}<div class="bubble-footer"><span>${formatTime(message.createdAt)}</span></div></div></div>`;
                }).join('') : '<div class="empty-state">Pick a room to begin chatting.</div>'}
              </div>
              <form class="composer" id="composer-form">
                ${state.selectedImage ? `<div class="preview-card"><img src="${state.selectedImage}" alt="Preview"><button type="button" class="ghost-btn" id="remove-image">Remove</button></div>` : ''}
                <div class="input-row">
                  <input id="draft" value="${state.draft}" placeholder="Write a message…">
                  <label class="upload-btn">+ Image<input id="image-input" type="file" accept="image/*"></label>
                  <button class="primary-btn" type="submit">Send</button>
                </div>
              </form>
              ${state.error ? `<p class="status error">${state.error}</p>` : ''}
            </main>
            ${state.renameModalOpen ? `
              <div class="modal-backdrop">
                <div class="modal-card">
                  <div class="modal-header">
                    <h3>Rename chat</h3>
                    <button class="ghost-btn" id="close-rename-modal" type="button">Close</button>
                  </div>
                  <label class="modal-label">
                    New chat name
                    <input id="rename-room-input" value="${state.renameDraft}" placeholder="Enter a new name">
                  </label>
                  <div class="modal-actions">
                    <button class="ghost-btn" id="cancel-rename-modal" type="button">Cancel</button>
                    <button class="primary-btn" id="save-rename-modal" type="button">Save name</button>
                  </div>
                </div>
              </div>` : ''}
            ${state.groupModalOpen ? `
              <div class="modal-backdrop">
                <div class="modal-card">
                  <div class="modal-header">
                    <h3>Create group</h3>
                    <button class="ghost-btn" id="close-group-modal" type="button">Close</button>
                  </div>
                  <label class="modal-label">
                    Group name
                    <input id="group-name-input" value="${state.groupName}" placeholder="Team ideas">
                  </label>
                  <p class="modal-help">Choose at least 2 accounts to add to the group chat.</p>
                  <div class="member-picker">
                    ${contacts.map((contact) => {
                      const selected = state.selectedGroupMembers.includes(contact.id);
                      return `<label class="member-option ${selected ? 'selected' : ''}"><input type="checkbox" data-contact="${contact.id}" ${selected ? 'checked' : ''}> <span>${contact.name}</span></label>`;
                    }).join('')}
                  </div>
                  <div class="modal-actions">
                    <button class="ghost-btn" id="cancel-group-modal" type="button">Cancel</button>
                    <button class="primary-btn" id="create-group-chat" type="button">Create group</button>
                  </div>
                </div>
              </div>` : ''}
          </div>`;

        document.getElementById('open-profile-page')?.addEventListener('click', () => {
          state.profileOpen = true;
          state.profileUserId = state.currentUser.id;
          render();
        });
        document.getElementById('logout').addEventListener('click', handleLogout);
        document.getElementById('close-rename-modal')?.addEventListener('click', closeRenameModal);
        document.getElementById('cancel-rename-modal')?.addEventListener('click', closeRenameModal);
        document.getElementById('save-rename-modal')?.addEventListener('click', saveRoomRename);
        document.getElementById('rename-room-input')?.addEventListener('input', (event) => {
          state.renameDraft = event.target.value;
        });
        document.getElementById('select-accounts').addEventListener('click', () => {
          state.groupModalOpen = true;
          render();
        });
        document.getElementById('close-group-modal')?.addEventListener('click', closeGroupModal);
        document.getElementById('cancel-group-modal')?.addEventListener('click', closeGroupModal);
        document.getElementById('create-group-chat')?.addEventListener('click', createGroupChat);
        document.getElementById('group-name-input')?.addEventListener('input', (event) => {
          state.groupName = event.target.value;
        });
        document.querySelectorAll('.member-option input').forEach((input) => {
          input.addEventListener('change', () => {
            const contactId = input.dataset.contact;
            state.selectedGroupMembers = state.selectedGroupMembers.includes(contactId)
              ? state.selectedGroupMembers.filter((memberId) => memberId !== contactId)
              : [...state.selectedGroupMembers, contactId];
            render();
          });
        });
        document.querySelectorAll('[data-room]').forEach((button) => {
          button.addEventListener('click', () => {
            if (button.dataset.profileUser) {
              state.profileOpen = true;
              state.profileUserId = button.dataset.profileUser;
              state.activeRoomMenuKey = null;
              render();
              return;
            }
            state.activeRoomKey = button.dataset.room;
            state.activeContactId = button.dataset.contact || null;
            state.activeRoomMenuKey = null;
            render();
          });
        });
        document.querySelectorAll('[data-room-menu-toggle]').forEach((button) => {
          button.addEventListener('click', (event) => {
            event.stopPropagation();
            const roomKey = button.dataset.roomMenuToggle;
            state.activeRoomMenuKey = state.activeRoomMenuKey === roomKey ? null : roomKey;
            render();
          });
        });
        document.querySelectorAll('[data-room-rename]').forEach((button) => {
          button.addEventListener('click', (event) => {
            event.stopPropagation();
            openRenameRoomModal(button.dataset.roomRename);
          });
        });
        document.querySelectorAll('[data-room-pin]').forEach((button) => {
          button.addEventListener('click', (event) => {
            event.stopPropagation();
            state.authMessage = 'Chat pinned.';
            state.activeRoomMenuKey = null;
            render();
          });
        });
        document.querySelectorAll('[data-room-delete]').forEach((button) => {
          button.addEventListener('click', (event) => {
            event.stopPropagation();
            deleteGroupRoom(button.dataset.roomDelete);
          });
        });
        document.getElementById('composer-form').addEventListener('submit', (event) => {
          event.preventDefault();
          sendMessage();
        });
        document.getElementById('draft').addEventListener('input', (event) => {
          state.draft = event.target.value;
        });
        document.getElementById('image-input').addEventListener('change', handleImageSelect);
        if (document.getElementById('remove-image')) {
          document.getElementById('remove-image').addEventListener('click', () => {
            state.selectedImage = '';
            render();
          });
        }
      }

      function syncGroupMembershipsToDatabase(roomKey, memberIds) {
        if (!firebaseDatabase || !roomKey) return;

        const roomMetaRef = firebaseDatabase.ref(`roomMeta/${roomKey}`);
        roomMetaRef.set(state.roomMeta[roomKey]);

        const conversationRef = firebaseDatabase.ref(`conversations/${roomKey}`);
        conversationRef.set(state.conversations[roomKey] || []);

        memberIds.forEach((memberId) => {
          const user = state.users.find((entry) => entry.id === memberId);
          const currentRooms = user?.rooms || [];
          const nextRooms = currentRooms.includes(roomKey) ? currentRooms : [...currentRooms, roomKey];
          firebaseDatabase.ref(`users/${memberId}/rooms`).set(nextRooms);
        });
      }

      function bootstrap() {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          try {
            const parsed = JSON.parse(raw);
            state.users = (parsed.users || []).filter((user) => !isHiddenContact(user));
            state.conversations = parsed.conversations || {};
            state.roomMeta = parsed.roomMeta || {};
            state.activeContactId = parsed.activeContactId || null;
            state.activeRoomKey = parsed.activeRoomKey || null;
            state.friends = parsed.friends || [];
            state.friendRequests = parsed.friendRequests || [];
          } catch {
            state.users = [];
          }
        }

        if (!window.firebase) {
          state.authError = 'Firebase SDK failed to load.';
          state.authReady = true;
          render();
          return;
        }

        if (!firebase.apps.length) {
          firebase.initializeApp(firebaseConfig);
        }

        firebaseAuth = firebase.auth();
        firebaseDatabase = firebase.database();
        syncUsersFromDatabase();
        syncRoomMetaFromDatabase();
        syncConversationsFromDatabase();
        firebaseAuth.onAuthStateChanged((user) => {
          state.authReady = true;
          state.authLoading = false;
          if (user) {
            const normalized = upsertUser(user);
            state.currentUser = normalized;
            writeCurrentUserToDatabase(normalized);
            state.authError = '';
            state.authMessage = `Signed in as ${state.currentUser.name}`;
          } else {
            if (state.currentUser && firebaseDatabase) {
              firebaseDatabase.ref(`users/${state.currentUser.id}`).remove();
            }
            state.currentUser = null;
            state.authMessage = '';
          }
          render();
        });
      }

      async function handleGoogleLogin() {
        if (!firebaseAuth) {
          state.authError = 'Firebase authentication is not ready yet.';
          render();
          return;
        }

        if (firebaseConfig.projectId.includes('YOUR_') || firebaseConfig.apiKey.includes('YOUR_')) {
          state.authError = 'Replace the Firebase config placeholders with your project values before testing sign-in.';
          render();
          return;
        }

        state.authLoading = true;
        state.authError = '';
        state.authMessage = '';
        render();

        try {
          const provider = new firebase.auth.GoogleAuthProvider();
          provider.setCustomParameters({ prompt: 'select_account' });
          await firebaseAuth.signInWithPopup(provider);
          state.authLoading = false;
          state.authMessage = 'Signed in successfully.';
          render();
        } catch (error) {
          state.authLoading = false;
          state.authError = mapAuthError(error);
          render();
        }
      }

      async function handleLogout() {
        try {
          if (state.currentUser && firebaseDatabase) {
            firebaseDatabase.ref(`users/${state.currentUser.id}`).remove();
          }
          await firebaseAuth.signOut();
          state.currentUser = null;
          state.activeContactId = null;
          state.authMessage = 'Signed out.';
          render();
        } catch (error) {
          state.authError = mapAuthError(error);
          render();
        }
      }

      function sendFriendRequest(targetId) {
        if (!state.currentUser) return;
        const targetUser = state.users.find((user) => user.id === targetId);
        if (!targetUser) return;
        const alreadyRequested = state.friendRequests.some((request) => request.fromId === state.currentUser.id && request.toId === targetId);
        if (alreadyRequested) {
          state.authMessage = `Friend request already sent to ${targetUser.name}.`;
          render();
          return;
        }
        state.friendRequests = [...state.friendRequests, { id: createId('friend'), fromId: state.currentUser.id, toId: targetId, name: state.currentUser.name }];
        state.authMessage = `Friend request sent to ${targetUser.name}.`;
        persist();
        render();
      }

      function acceptFriendRequest(requestId) {
        const request = state.friendRequests.find((item) => item.id === requestId);
        if (!request) return;
        state.friends = [...new Set([...state.friends, request.fromId, request.toId])];
        state.friendRequests = state.friendRequests.filter((item) => item.id !== requestId);
        state.authMessage = `You are now friends with ${request.name}.`;
        persist();
        render();
      }

      function declineFriendRequest(requestId) {
        state.friendRequests = state.friendRequests.filter((item) => item.id !== requestId);
        state.authMessage = 'Friend request declined.';
        persist();
        render();
      }

      function closeGroupModal() {
        state.groupModalOpen = false;
        state.groupName = '';
        state.selectedGroupMembers = [];
        render();
      }

      function handleDetectiveAccess() {
        if (state.detectiveMode) {
          state.detectiveMode = false;
          state.impersonatedUserId = null;
          state.authMessage = 'Detective mode disabled.';
          render();
          return;
        }
        const password = window.prompt('Enter detective password');
        if (password === 'snake') {
          state.detectiveMode = true;
          state.impersonatedUserId = state.currentUser.id;
          state.authMessage = 'Detective mode enabled.';
          render();
        } else {
          state.authMessage = 'Incorrect password.';
          render();
        }
      }

      function handleDeleteMessage(messageId) {
        if (!state.activeRoomKey) return;
        state.conversations[state.activeRoomKey] = (state.conversations[state.activeRoomKey] || []).filter((message) => message.id !== messageId);
        state.authMessage = 'Message deleted.';
        persist();
        render();
      }

      function openRenameRoomModal(roomKey) {
        const roomMeta = state.roomMeta[roomKey];
        if (!roomMeta || roomMeta.type !== 'group') return;
        state.renameTargetRoomKey = roomKey;
        state.renameDraft = roomMeta.name || 'New group';
        state.renameModalOpen = true;
        render();
      }

      function closeRenameModal() {
        state.renameModalOpen = false;
        state.renameTargetRoomKey = null;
        state.renameDraft = '';
        render();
      }

      function saveRoomRename() {
        const trimmed = state.renameDraft.trim();
        if (!state.renameTargetRoomKey || !trimmed) return;
        state.roomMeta[state.renameTargetRoomKey] = {
          ...(state.roomMeta[state.renameTargetRoomKey] || {}),
          name: trimmed,
        };
        state.authMessage = 'Chat renamed.';
        state.renameModalOpen = false;
        state.renameTargetRoomKey = null;
        state.renameDraft = '';
        persist();
        render();
      }

      function deleteGroupRoom(roomKey) {
        if (!roomKey) return;
        delete state.roomMeta[roomKey];
        delete state.conversations[roomKey];
        state.currentUser.rooms = (state.currentUser.rooms || []).filter((joinedRoomKey) => joinedRoomKey !== roomKey);
        state.users = state.users.map((user) => {
          if (user.id !== state.currentUser.id) return user;
          return { ...user, rooms: (user.rooms || []).filter((joinedRoomKey) => joinedRoomKey !== roomKey) };
        });
        if (state.activeRoomKey === roomKey) {
          const fallbackRoomKey = Object.keys(state.roomMeta).find((key) => state.roomMeta[key]?.type === 'group' || state.roomMeta[key]?.type === 'direct');
          state.activeRoomKey = fallbackRoomKey || null;
        }
        state.activeRoomMenuKey = null;
        state.authMessage = 'Chat removed from your messages.';
        persist();
        render();
      }

      function createGroupChat() {
        if (!state.currentUser) return;
        if (state.selectedGroupMembers.length < 2) {
          state.error = 'Choose at least 2 accounts to start a group chat.';
          render();
          return;
        }
        const roomKey = [state.currentUser.id, ...state.selectedGroupMembers].sort().join('-');
        const cleanedName = state.groupName.trim() || 'New group';
        const memberIds = [state.currentUser.id, ...state.selectedGroupMembers];
        state.roomMeta[roomKey] = {
          type: 'group',
          name: cleanedName,
          memberIds,
        };
        state.conversations[roomKey] = state.conversations[roomKey] || [];
        memberIds.forEach((memberId) => {
          const user = state.users.find((entry) => entry.id === memberId);
          if (user) {
            user.rooms = user.rooms || [];
            if (!user.rooms.includes(roomKey)) {
              user.rooms.push(roomKey);
            }
          }
        });
        state.currentUser.rooms = state.currentUser.rooms || [];
        if (!state.currentUser.rooms.includes(roomKey)) {
          state.currentUser.rooms.push(roomKey);
        }
        state.activeRoomKey = roomKey;
        state.activeContactId = null;
        state.groupModalOpen = false;
        state.groupName = '';
        state.selectedGroupMembers = [];
        state.error = '';
        syncGroupMembershipsToDatabase(roomKey, memberIds);
        persist();
        render();
      }

      function sendMessage() {
        if (!state.currentUser) return;
        const cleanText = state.draft.trim();
        if (!cleanText && !state.selectedImage) {
          state.error = 'Add a note or choose an image before sending.';
          render();
          return;
        }
        state.error = '';
        const roomKey = state.activeRoomKey || (state.activeContactId ? [state.currentUser.id, state.activeContactId].sort().join('-') : null);
        if (!roomKey) {
          render();
          return;
        }
        const senderId = state.detectiveMode ? (state.impersonatedUserId || state.currentUser.id) : state.currentUser.id;
        const outgoing = { id: createId('msg'), senderId, text: cleanText, image: state.selectedImage, createdAt: new Date().toISOString() };
        const roomRef = firebaseDatabase ? firebaseDatabase.ref(`conversations/${roomKey}`) : null;
        state.conversations[roomKey] = [...(state.conversations[roomKey] || []), outgoing];
        playNotificationSound('send');
        state.draft = '';
        state.selectedImage = '';
        persist();
        render();

        if (roomRef) {
          roomRef.push(outgoing);
        }
      }

      function handleImageSelect(event) {
        const file = event.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          state.selectedImage = reader.result;
          render();
        };
        reader.readAsDataURL(file);
      }

      bootstrap();
    </script>
  </body>
</html>
