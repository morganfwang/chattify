<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#060816" />
    <title>PulseChat</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        line-height: 1.5;
        font-weight: 400;
        background: #060816;
        color: #f5f7ff;

      button, input { font: inherit; }

      #app { min-height: 100vh; }
      .app-shell { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
      .auth-card, .sidebar, .chat-panel, .loading-card {

      .auth-card { width: min(100%, 430px); padding: 32px; border-radius: 24px; }

      .dashboard-shell { align-items: flex-start; padding: 18px; }
      .sidebar { width: min(100%, 360px); border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 16px; position: sticky; top: 18px; max-height: calc(100vh - 36px); overflow: auto; }
      .profile-card { display: flex; gap: 12px; align-items: center; padding: 14px; border-radius: 16px; background: rgba(255,255,255,0.04); }
      .profile-card.clickable { cursor: pointer; transition: transform 160ms ease, background 160ms ease; }
      .profile-card.clickable:hover { transform: translateY(-1px); background: rgba(255,255,255,0.07); }
      .profile-page { width: min(100%, 860px); max-height: calc(100vh - 40px); overflow: auto; padding: 24px; border-radius: 24px; background: rgba(6, 12, 31, 0.95); border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 24px 70px rgba(0,0,0,0.35); color: #f4f7ff; }
      .profile-hero { display: flex; gap: 20px; align-items: center; margin-bottom: 20px; flex-wrap: wrap; }
      .profile-hero .avatar { width: 88px; height: 88px; font-size: 1.4rem; }
      .profile-badge { display: inline-flex; align-items: center; gap: 8px; margin-top: 8px; padding: 8px 12px; border-radius: 999px; background: rgba(36,192,203,0.16); color: #86f3ff; font-size: 0.9rem; }
      .profile-grid { display: grid; gap: 16px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .profile-card-panel { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 16px; }
      .profile-list { display: grid; gap: 8px; margin-top: 10px; }

      .avatar.small { width: 40px; height: 40px; font-size: 0.9rem; }
      .avatar img { width: 100%; height: 100%; object-fit: cover; }
      .online-pill { display: inline-flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 0.8rem; color: #7ee3b4; }
      .online-pill::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: #3ee98f; box-shadow: 0 0 0 4px rgba(62, 233, 143, 0.2); display: inline-block; }
      .presence-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 0.82rem; color: #9da8cf; white-space: nowrap; }
      .presence-badge.online { color: #7ee3b4; }

      .setting-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }

      .contact-card.active { border-color: #7c6cf7; background: rgba(124,108,247,0.16); }
      .room-menu-wrapper { position: relative; flex-shrink: 0; }
      .room-menu-btn { width: 36px; height: 36px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.04); color: #f2f5ff; font-size: 1.1rem; line-height: 1; }
      .chat-menu { position: absolute; right: 0; top: calc(100% + 6px); min-width: 140px; display: flex; flex-direction: column; gap: 6px; padding: 8px; background: rgba(8, 14, 33, 0.96); border: 1px solid rgba(255,255,255,0.12); border-radius: 12px; box-shadow: 0 12px 30px rgba(0,0,0,0.28); z-index: 10; }
      .chat-menu button { border: 0; background: transparent; color: #f3f6ff; padding: 8px 10px; border-radius: 8px; text-align: left; }
      .chat-menu button:hover { background: rgba(255,255,255,0.08); }
      .chat-menu .menu-danger { color: #ff8a8a; }
      .contact-body { flex: 1; min-width: 0; }
      .contact-topline { display: flex; justify-content: space-between; gap: 10px; font-size: 0.95rem; align-items: center; }
      .contact-topline strong {
        display: inline-block;
        min-width: 0;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;

      }
      .profile-card h2 {
        font-size: 1rem;
        margin: 0;
        max-width: calc(100% - 12px);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .profile-card p { margin: 0; }
      .contact-body p { color: #9da8cf; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .chat-panel { flex: 1; width: min(100%, 860px); max-width: 860px; border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 16px; height: calc(100vh - 36px); min-height: 0; margin-left: 16px; overflow: hidden; position: relative; }
      .chat-header { display: flex; justify-content: space-between; align-items: flex-start; padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.08); gap: 12px; flex-shrink: 0; }
      .chat-header-meta { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
      .chat-status-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-height: 22px; }
      .header-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
      .composer { position: sticky; bottom: 0; display: flex; flex-direction: column; gap: 10px; background: rgba(6, 12, 31, 0.96); border-top: 1px solid rgba(255,255,255,0.08); padding-top: 12px; padding-bottom: 6px; z-index: 2; flex-shrink: 0; }
      .header-badge { padding: 7px 12px; border-radius: 999px; background: rgba(36,192,203,0.16); color: #86f3ff; font-size: 0.9rem; }
      .room-subtitle { color: #94a0c4; font-size: 0.92rem; margin-top: 4px; }
      .detective-controls { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.04); color: #e7ecff; }
      .detective-controls select { border: 0; background: transparent; color: #f5f7ff; outline: none; }
      .detective-active { border-color: #24c0cb; color: #86f3ff; }
      .bubble-footer { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
      .delete-btn { border: 0; background: rgba(255,255,255,0.16); color: white; border-radius: 999px; padding: 4px 8px; font-size: 0.75rem; }
      .modal-backdrop { position: fixed; inset: 0; background: rgba(3, 6, 16, 0.78); display: grid; place-items: center; padding: 20px; z-index: 40; }
      .modal-card { width: min(100%, 540px); background: rgba(8, 14, 33, 0.96); border: 1px solid rgba(255,255,255,0.12); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
      .modal-header { display: flex; justify-content: space-between; align-items: center; }
      .modal-help { color: #9da8cf; font-size: 0.92rem; }
      .member-picker { display: grid; gap: 8px; max-height: 220px; overflow: auto; padding-right: 4px; }
      .member-option { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.04); color: #f2f5ff; }
      .member-option.selected { border-color: #24c0cb; background: rgba(36,192,203,0.14); }
      .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 6px; }
      .message-list { flex: 1 1 auto; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 10px; padding-right: 4px; padding-bottom: 10px; overflow-anchor: none; }
      .message-row { display: flex; }
      .message-row.mine { justify-content: flex-end; }
      .bubble { max-width: min(78%, 520px); background: rgba(255,255,255,0.08); border-radius: 16px 16px 16px 6px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; overflow-wrap: break-word; word-break: break-word; }
      .bubble.mine { background: linear-gradient(135deg, rgba(124,108,247,0.95), rgba(36,192,203,0.86)); border-radius: 16px 16px 6px 16px; }
      .bubble p { color: #f9fbff; margin: 0; white-space: pre-wrap; overflow-wrap: break-word; word-break: break-word; }
      .bubble img { width: 100%; max-height: 220px; object-fit: cover; border-radius: 12px; }
      .sender-name { font-size: 0.78rem; font-weight: 700; color: #dce8ff; margin-bottom: 2px; }
      .bubble span { font-size: 0.75rem; color: rgba(255,255,255,0.72); align-self: flex-end; }
      .typing-bubble { flex-direction: row; gap: 6px; align-items: center; padding: 12px; }
      .typing-bubble span { width: 8px; height: 8px; border-radius: 50%; background: white; display: inline-block; animation: pulse 1s infinite ease-in-out; }
      .typing-bubble span:nth-child(2) { animation-delay: 0.2s; }
      .typing-bubble span:nth-child(3) { animation-delay: 0.4s; }
      @keyframes pulse { 0%,80%,100% { transform: scale(0.8); opacity: 0.5; } 40% { transform: scale(1.1); opacity: 1; } }
      .composer { display: flex; flex-direction: column; gap: 10px; }
      .input-row { display: flex; gap: 10px; align-items: flex-end; }
      .input-row textarea { flex: 1; min-height: 44px; max-height: 140px; resize: none; overflow-y: auto; padding: 12px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.06); color: white; }
      .input-row textarea::placeholder { color: #8ea0d3; }
      .input-row input { flex: 1; }
      .upload-btn { display: inline-flex; align-items: center; justify-content: center; border-radius: 12px; border: 1px solid rgba(255,255,255,0.13); padding: 10px 12px; color: #dfe7ff; background: rgba(255,255,255,0.04); flex-shrink: 0; }
      .upload-btn input { display: none; }
      .preview-card { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 8px 10px; }
      .preview-card img { width: 60px; height: 60px; object-fit: cover; border-radius: 10px; }
      .empty-state { color: #94a0c4; padding: 24px 0; text-align: center; }
      @media (max-width: 900px) {
        .dashboard-shell { flex-direction: column; }
        .sidebar { width: 100%; }
        .chat-panel { margin-left: 0; min-height: unset; }
      }
      @media (max-width: 620px) {
        .auth-card { padding: 24px; }
        .input-row { flex-wrap: wrap; }
        .input-row > * { flex: 1 1 100%; }
        .chat-header { flex-direction: column; align-items: flex-start; gap: 8px; }
        .bubble { max-width: 100%; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
    <script>
      const STORAGE_KEY = 'pulsechat-state-v1';
      const firebaseConfig = {
        apiKey: "AIzaSyBBdWdwBh1QVZ8Cjqayj4nJBtHuzeyHl2Q",
        authDomain: "chattify-d2431.firebaseapp.com",
        databaseURL: "https://chattify-d2431-default-rtdb.asia-southeast1.firebasedatabase.app/",
        projectId: "chattify-d2431",
        storageBucket: "chattify-d2431.firebasestorage.app",
        messagingSenderId: "20850150249",
        appId: "1:20850150249:web:92d64b1c00ac68f8fe0bf8",
        measurementId: "G-NJTHTJ8DM5"
      };
      const demoUsers = [];

      function createId(prefix) {
        return `${prefix}-${Math.random().toString(36).slice(2, 10)}`;
      }
      function getInitials(name) {
        return name.split(' ').slice(0, 2).map((part) => part[0]).join('').toUpperCase();
      }
      function formatTime(timestamp) {
        if (timestamp == null) return '';
        if (typeof timestamp === 'object') {
          timestamp = timestamp?.toString?.() || state.currentUser?.lastSeen || Date.now();
        }
        const parsed = Number(timestamp);
        if (!Number.isFinite(parsed)) {
          timestamp = timestamp.toString();
        } else {
          timestamp = parsed;
        }
        return new Date(timestamp).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
      }

      function isHiddenContact(user) {
        const hiddenNames = ['ava chen', 'noah singh', 'mina alvarez'];
        const name = String(user?.name || '').trim().toLowerCase();
        return hiddenNames.some((hiddenName) => name.includes(hiddenName));
      }

      const state = {
        authReady: false,
        authLoading: false,
        authError: '',
        authMessage: '',
        profileOpen: false,
        profileUserId: null,
        profileEditMode: false,
        profileEditForm: { name: '', email: '', role: '' },
        users: [],
        currentUser: null,
        conversations: {},
        roomMeta: {},
        activeContactId: null,
        activeRoomKey: null,
        draft: '',
        error: '',
        selectedImage: '',
        selectedImageFile: null,
        uploadingImage: false,
        selectedImagePreview: '',
        groupModalOpen: false,
        groupName: '',
        selectedGroupMembers: [],
        detectiveMode: false,
        impersonatedUserId: null,
        discoverQuery: '',
        friends: [],
        friendRequests: [],
        renameModalOpen: false,
        renameTargetRoomKey: null,
        renameDraft: '',
        activeRoomMenuKey: null,
        settingsOpen: false,
        settings: { notificationsEnabled: true, browserNotificationsEnabled: true, vibrationEnabled: true, volume: 0.7 },
        presenceByUserId: {},
        typingUsersByRoom: {},
        messageScrollInfo: { roomKey: null, scrollTop: 0, scrollHeight: 0, clientHeight: 0 },
        eventsBound: false,
        isDraftEditing: false,
        suppressTypingRender: false,
        sendStatus: 'idle',
        sendError: '',
        failedMessage: null,
        connectionId: null,
      };
      let hasSyncedConversations = false;
      let audioContext = null;
      const typingTimeouts = {};
      let presenceSyncRef = null;
      let typingSyncRef = null;
      let connectedRef = null;
      let currentConnectionRef = null;
      let userLastSeenOnDisconnectRef = null;
      let notificationPermissionRequested = false;
      let lastNotifiedMessageIds = new Set();
      let firebaseStorage = null;
      let activeRoomListenerKey = null;
      const roomMessageListeners = {};
      const roomMessageIds = {};
      const roomPageState = {};
      let messageListScrollHandler = null;

      function ensureAudioContext() {
        if (audioContext) return audioContext;
        if (window.AudioContext || window.webkitAudioContext) {
          audioContext = new (window.AudioContext || window.webkitAudioContext)();
        }
        return audioContext;
      }

      function playNotificationSound(type = 'receive') {
        if (!state.settings.notificationsEnabled) return;
        const context = ensureAudioContext();
        if (!context) return;
        const volume = Math.max(0, Math.min(1, state.settings.volume || 0.7));
        const frequency = type === 'receive' ? 520 : 760;
        const duration = type === 'receive' ? 0.14 : 0.08;
        const gainNode = context.createGain();
        const oscillator = context.createOscillator();

        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(frequency, context.currentTime);
        gainNode.gain.setValueAtTime(volume * 0.18, context.currentTime);

        oscillator.connect(gainNode);
        gainNode.connect(context.destination);

        if (context.state === 'suspended') {
          context.resume();
        }

        oscillator.start();
        oscillator.stop(context.currentTime + duration);
      }

      function requestBrowserNotificationPermission() {
        if (notificationPermissionRequested || !('Notification' in window)) return;
        notificationPermissionRequested = true;
        Notification.requestPermission().then(() => {
          render();
        });
      }

      function sendBrowserNotification(message, room) {
        if (!state.settings.browserNotificationsEnabled || document.visibilityState === 'visible') return;
        if (!('Notification' in window) || Notification.permission !== 'granted') return;
        const sender = state.users.find((user) => user.id === message.senderId);
        const title = sender ? `${sender.name} sent a message` : 'New message';
        const preview = message.text || 'Image shared';
        const body = room?.type === 'group' ? `${room.name}: ${preview}` : preview;
        const notification = new Notification(title, {
          body,
          icon: sender?.photoURL || undefined,
          vibrate: state.settings.vibrationEnabled ? [100, 50, 100] : undefined,
        });
        notification.onclick = () => {
          window.focus();
          notification.close();
        };
      }

      const app = document.getElementById('app');
      let firebaseAuth = null;
      let firebaseDatabase = null;
      let usersSyncRef = null;
      let conversationsSyncRef = null;
      let roomMetaSyncRef = null;

      function normalizeUser(user) {
        return {
          id: user.uid,
          uid: user.uid,
          name: user.displayName || user.email?.split('@')[0] || 'Google User',
          email: user.email || '',
          photoURL: user.photoURL || '',
          role: 'Authenticated with Google',
          color: '#7c6cf7',
        };
      }

      function upsertUser(user) {
        const normalized = normalizeUser(user);
        const existingIndex = state.users.findIndex((entry) => entry.id === normalized.id || entry.email === normalized.email);
        if (existingIndex >= 0) {
          state.users[existingIndex] = { ...state.users[existingIndex], ...normalized, rooms: state.users[existingIndex].rooms || [] };
          return state.users[existingIndex];
        }
        state.users = [...state.users, { ...normalized, rooms: [] }];
        return normalized;
      }

      function mapAuthError(error) {
        if (error?.code === 'auth/popup-blocked') {
          return 'The sign-in popup was blocked. Please allow popups and try again.';
        }
        if (error?.code === 'auth/popup-closed-by-user') {
          return 'Google sign-in was cancelled.';
        }
        if (error?.code === 'auth/network-request-failed') {
          return 'Network issue detected. Please check your connection and try again.';
        }
        return error?.message || 'Google sign-in failed.';
      }

      function persist() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          users: state.users,
          roomMeta: state.roomMeta,
          activeContactId: state.activeContactId,
          activeRoomKey: state.activeRoomKey,
          friends: state.friends,
          friendRequests: state.friendRequests,
        }));
        localStorage.setItem('pulsechat-settings-v1', JSON.stringify(state.settings));
      }

      function getActiveRoomKey() {
        return state.activeRoomKey || (state.activeContactId ? [state.currentUser?.id, state.activeContactId].sort().join('-') : null);
      }

      function isScrolledToBottom(element) {
        if (!element) return false;
        return element.scrollTop + element.clientHeight >= element.scrollHeight - 20;
      }

      function syncDraftFieldState() {
        const draftField = document.getElementById('draft');
        if (!draftField) return;
        if (draftField.value !== state.draft) {
          draftField.value = state.draft;
        }
        if (state.isDraftEditing && document.activeElement !== draftField) {
          draftField.focus();
          const end = draftField.value.length;
          draftField.setSelectionRange(end, end);
        }
        requestAnimationFrame(() => {
          if (!draftField) return;
          draftField.style.height = 'auto';
          draftField.style.height = `${Math.min(140, draftField.scrollHeight)}px`;
        });
      }

      function bindComposerEvents() {
        if (state.eventsBound || !app) return;
        state.eventsBound = true;

        app.addEventListener('submit', (event) => {
          if (event.target instanceof HTMLElement && event.target.closest('#composer-form')) {
            event.preventDefault();
            sendMessage();
          }
        });

        app.addEventListener('input', (event) => {
          const draftField = event.target;
          if (!(draftField instanceof HTMLTextAreaElement) || draftField.id !== 'draft') return;
          state.isDraftEditing = true;
          state.draft = draftField.value;
          setTypingStatus(getActiveRoomKey(), Boolean(state.draft.trim()));
          syncDraftFieldState();
        });

        app.addEventListener('keydown', (event) => {
          const draftField = event.target;
          if (!(draftField instanceof HTMLTextAreaElement) || draftField.id !== 'draft') return;
          if (event.key === 'Enter' && !event.shiftKey) {
            event.preventDefault();
            sendMessage();
          }
        });

        app.addEventListener('focusin', (event) => {
          if (event.target instanceof HTMLTextAreaElement && event.target.id === 'draft') {
            state.isDraftEditing = true;
            setTypingStatus(getActiveRoomKey(), Boolean(state.draft.trim()));
          }
        });

        app.addEventListener('focusout', (event) => {
          if (event.target instanceof HTMLTextAreaElement && event.target.id === 'draft') {
            state.isDraftEditing = false;
            setTypingStatus(getActiveRoomKey(), false);
          }
        });
      }

      function getUserPresence(userId) {
        const presence = state.presenceByUserId[userId];
        const fallbackUser = state.users.find((user) => user.id === userId);
        return {
          uid: userId,
          status: presence?.status || fallbackUser?.status || 'offline',
          lastSeen: presence?.lastSeen || fallbackUser?.lastSeen || Date.now(),
          name: presence?.name || fallbackUser?.name || '',
        };
      }

      function isUserOnline(userId) {
        return getUserPresence(userId).status === 'online';
      }

      function formatLastSeen(timestamp) {
        if (!timestamp) return 'Offline';
        const diff = Date.now() - timestamp;
        const minutes = Math.max(1, Math.round(diff / 60000));
        if (minutes < 60) {
          return `Last seen ${minutes} min ago`;
        }
        const hours = Math.floor(minutes / 60);
        if (hours < 24) {
          return `Last seen ${hours}h ago`;
        }
        const days = Math.floor(hours / 24);
        return `Last seen ${days}d ago`;
      }

      function getPresenceMarkup(userId, compact = false) {
        const presence = getUserPresence(userId);
        const isOnline = presence.status === 'online';
        const statusText = isOnline ? 'Online' : (compact ? 'Offline' : formatLastSeen(presence.lastSeen));
        return `<span class="presence-badge ${isOnline ? 'online' : 'offline'}"><span class="presence-dot ${isOnline ? 'online' : 'offline'}"></span>${statusText}</span>`;
      }

      function getMemberPresenceMarkup(memberId) {
        const presence = getUserPresence(memberId);
        const isOnline = presence.status === 'online';
        return `<span class="member-presence ${isOnline ? 'online' : 'offline'}"><span class="presence-dot ${isOnline ? 'online' : 'offline'}"></span>${presence.name || 'Member'}</span>`;
      }

      function syncUsersFromDatabase() {
        if (!firebaseDatabase) return;
        if (usersSyncRef) {
          firebaseDatabase.ref('users').off('value', usersSyncRef);
        }

        usersSyncRef = (snapshot) => {
          const values = snapshot.val() || {};
          const remoteUsers = Object.values(values).filter(Boolean);
          const mergedUsers = [...state.users];

          remoteUsers.forEach((entry) => {
            const normalized = {
              ...entry,
              id: entry.id || entry.uid || entry.email,
              uid: entry.uid || entry.id || entry.email,
              name: entry.name || entry.email?.split('@')[0] || 'Google User',
              email: entry.email || '',
              photoURL: entry.photoURL || '',
              role: entry.role || 'Authenticated with Google',
              color: entry.color || '#7c6cf7',
              rooms: entry.rooms || [],
            };

            const existingIndex = mergedUsers.findIndex((user) => user.id === normalized.id || user.email === normalized.email);
            if (existingIndex >= 0) {
              mergedUsers[existingIndex] = {
                ...mergedUsers[existingIndex],
                ...normalized,
                rooms: normalized.rooms || mergedUsers[existingIndex].rooms || [],
              };
            } else {
              mergedUsers.push(normalized);
            }
          });

          state.users = mergedUsers.filter((user) => !isHiddenContact(user));
          if (state.currentUser) {
            const refreshed = state.users.find((user) => user.id === state.currentUser.id || user.email === state.currentUser.email);
            if (refreshed) {
              state.currentUser = refreshed;
            }
          }
          persist();
          render();
        };

        firebaseDatabase.ref('users').on('value', usersSyncRef);
      }

      function setUserPresenceOnline(user) {
        if (!firebaseDatabase || !user) return;
        const userRef = firebaseDatabase.ref(`users/${user.id}`);
        const presenceRef = firebaseDatabase.ref(`presence/${user.id}`);
        const payload = {
          ...user,
          status: 'online',
          lastSeen: Date.now(),
        };
        userRef.set(payload);
        presenceRef.set({ uid: user.id, name: user.name, email: user.email, status: 'online', lastSeen: Date.now() });

        if (currentConnectionRef) {
          currentConnectionRef.remove();
        }
        currentConnectionRef = firebaseDatabase.ref(`presence/${user.id}/connections/${state.connectionId}`);
        userLastSeenOnDisconnectRef = firebaseDatabase.ref(`presence/${user.id}`);

        currentConnectionRef.set({ connectedAt: Date.now() });
        currentConnectionRef.onDisconnect().remove();
        userLastSeenOnDisconnectRef.onDisconnect().update({ status: 'offline', lastSeen: Date.now() });
      }

      function writeCurrentUserToDatabase(user) {
        setUserPresenceOnline(user);
      }

      function setUserPresenceOffline() {
        if (!firebaseDatabase || !state.currentUser) return;
        const userRef = firebaseDatabase.ref(`users/${state.currentUser.id}`);
        const presenceRef = firebaseDatabase.ref(`presence/${state.currentUser.id}`);
        userRef.update({ status: 'offline', lastSeen: Date.now() });
        presenceRef.update({ status: 'offline', lastSeen: Date.now() });
        if (currentConnectionRef) {
          currentConnectionRef.remove();
          currentConnectionRef = null;
        }
      }

      function syncPresenceFromDatabase() {
        if (!firebaseDatabase) return;
        if (presenceSyncRef) {
          firebaseDatabase.ref('presence').off('value', presenceSyncRef);
        }

        presenceSyncRef = (snapshot) => {
          const values = snapshot.val() || {};
          const nextPresence = {};
          Object.entries(values).forEach(([userId, entry]) => {
            if (!entry) return;
            const status = entry.status === 'online' || (entry.connections && Object.keys(entry.connections).length > 0) ? 'online' : 'offline';
            const lastSeen = status === 'online' ? entry.lastSeen || Date.now() : entry.lastSeen || Date.now();
            nextPresence[userId] = {
              uid: userId,
              ...entry,
              status,
              lastSeen,
            };
          });

          state.presenceByUserId = nextPresence;
          state.users = state.users.map((user) => {
            const presence = nextPresence[user.id];
            if (!presence) return user;
            return {
              ...user,
              status: presence.status || 'offline',
              lastSeen: presence.lastSeen || user.lastSeen || Date.now(),
            };
          });
          persist();
          render();
        };

        firebaseDatabase.ref('presence').on('value', presenceSyncRef);
      }

      function syncTypingFromDatabase() {
        if (!firebaseDatabase) return;
        if (typingSyncRef) {
          firebaseDatabase.ref('typing').off('value', typingSyncRef);
        }

        typingSyncRef = (snapshot) => {
          const values = snapshot.val() || {};
          const typingByRoom = {};
          Object.entries(values).forEach(([roomKey, members]) => {
            const entries = Object.values(members || {}).filter(Boolean);
            typingByRoom[roomKey] = entries.filter((entry) => entry.uid !== state.currentUser?.id);
          });
          state.typingUsersByRoom = typingByRoom;
          if (!state.suppressTypingRender) {
            render();
          }
        };

        firebaseDatabase.ref('typing').on('value', typingSyncRef);
      }

      function setTypingStatus(roomKey, isTyping) {
        if (!firebaseDatabase || !state.currentUser || !roomKey) return;
        const typingRef = firebaseDatabase.ref(`typing/${roomKey}/${state.currentUser.id}`);
        state.suppressTypingRender = true;
        if (isTyping) {
          typingRef.set({ uid: state.currentUser.id, name: state.currentUser.name, updatedAt: Date.now() });
          clearTimeout(typingTimeouts[roomKey]);
          typingTimeouts[roomKey] = setTimeout(() => {
            typingRef.remove();
          }, 1800);
        } else {
          typingRef.remove();
          clearTimeout(typingTimeouts[roomKey]);
        }
        window.setTimeout(() => {
          state.suppressTypingRender = false;
        }, 0);
      }

      function syncRoomMetaFromDatabase() {
        if (!firebaseDatabase) return;
        if (roomMetaSyncRef) {
          firebaseDatabase.ref('roomMeta').off('value', roomMetaSyncRef);
        }

        roomMetaSyncRef = (snapshot) => {
          const values = snapshot.val() || {};
          const normalizedRoomMeta = {};

          Object.entries(values).forEach(([roomKey, meta]) => {
            if (!meta) return;
            normalizedRoomMeta[roomKey] = meta;
          });

          state.roomMeta = normalizedRoomMeta;
          persist();
          render();
        };

        firebaseDatabase.ref('roomMeta').on('value', roomMetaSyncRef);
      }

      }

      function syncGroupMembershipsToDatabase(roomKey, memberIds) {
        if (!firebaseDatabase || !roomKey) return;

        const roomMetaRef = firebaseDatabase.ref(`roomMeta/${roomKey}`);
        roomMetaRef.set(state.roomMeta[roomKey]);

        const conversationRef = firebaseDatabase.ref(`conversations/${roomKey}`);
        conversationRef.set(state.conversations[roomKey] || []);

        memberIds.forEach((memberId) => {
          const user = state.users.find((entry) => entry.id === memberId);
          const currentRooms = user?.rooms || [];
          const nextRooms = currentRooms.includes(roomKey) ? currentRooms : [...currentRooms, roomKey];
          firebaseDatabase.ref(`users/${memberId}/rooms`).set(nextRooms);
        });
      }

      function bootstrap() {
        const raw = localStorage.getItem(STORAGE_KEY);
        const storedSettings = localStorage.getItem('pulsechat-settings-v1');
        if (storedSettings) {
          try {
            state.settings = { ...state.settings, ...JSON.parse(storedSettings) };
          } catch {
            state.settings = { ...state.settings, notificationsEnabled: true, browserNotificationsEnabled: true, vibrationEnabled: true, volume: 0.7 };
          }
        }
        if (raw) {
          try {
            const parsed = JSON.parse(raw);
            state.users = (parsed.users || []).filter((user) => !isHiddenContact(user));
            state.conversations = {};
            state.roomMeta = parsed.roomMeta || {};
            state.activeContactId = parsed.activeContactId || null;
            state.activeRoomKey = parsed.activeRoomKey || null;
            state.friends = parsed.friends || [];
            state.friendRequests = parsed.friendRequests || [];
          } catch {
            state.users = [];
          }
        }

        if (!window.firebase) {
          state.authError = 'Firebase SDK failed to load.';
          state.authReady = true;
          render();
          return;
        }

        if (!firebase.apps.length) {
          firebase.initializeApp(firebaseConfig);
        }

        firebaseAuth = firebase.auth();
        firebaseDatabase = firebase.database();
        firebaseStorage = firebase.storage();
        connectedRef = firebaseDatabase.ref('.info/connected');
        state.connectionId = state.connectionId || createId('conn');
        connectedRef.on('value', (snapshot) => {
          const isConnected = snapshot.val() === true;
          if (!isConnected) {
            return;
          }
          if (state.currentUser) {
            setUserPresenceOnline(state.currentUser);
          }
        });
        syncUsersFromDatabase();
        syncPresenceFromDatabase();
        syncTypingFromDatabase();
        syncRoomMetaFromDatabase();
        window.addEventListener('beforeunload', () => setUserPresenceOffline());
        firebaseAuth.onAuthStateChanged((user) => {
          state.authReady = true;
          state.authLoading = false;
          if (user) {
            const normalized = upsertUser(user);
            state.currentUser = normalized;
            writeCurrentUserToDatabase(normalized);
            state.authError = '';
            state.authMessage = `Signed in as ${state.currentUser.name}`;
          } else {
            if (state.currentUser && firebaseDatabase) {
              setUserPresenceOffline();
              firebaseDatabase.ref(`users/${state.currentUser.id}`).remove();
            }
            state.currentUser = null;
            state.authMessage = '';
          }
          render();
          if (state.activeRoomKey) {
            startRoomMessageListener(state.activeRoomKey);
          }
        });
      }

      async function handleGoogleLogin() {
        if (!firebaseAuth) {
          state.authError = 'Firebase authentication is not ready yet.';
          render();
          return;
        }

        if (firebaseConfig.projectId.includes('YOUR_') || firebaseConfig.apiKey.includes('YOUR_')) {
          state.authError = 'Replace the Firebase config placeholders with your project values before testing sign-in.';
          render();
          return;
        }

        state.authLoading = true;
        state.authError = '';
        state.authMessage = '';
        render();

        try {
          const provider = new firebase.auth.GoogleAuthProvider();
          provider.setCustomParameters({ prompt: 'select_account' });
          await firebaseAuth.signInWithPopup(provider);
          state.authLoading = false;
          state.authMessage = 'Signed in successfully.';
          render();
        } catch (error) {
          state.authLoading = false;
          state.authError = mapAuthError(error);
          render();
        }
      }

      async function handleLogout() {
        try {
          if (state.currentUser && firebaseDatabase) {
            setUserPresenceOffline();
            firebaseDatabase.ref(`users/${state.currentUser.id}`).remove();
          }
          await firebaseAuth.signOut();
          state.currentUser = null;
          state.activeContactId = null;
          state.authMessage = 'Signed out.';
          render();
        } catch (error) {
          state.authError = mapAuthError(error);
          render();
        }
      }

      function sendFriendRequest(targetId) {
        if (!state.currentUser) return;
        const targetUser = state.users.find((user) => user.id === targetId);
        if (!targetUser) return;
        const alreadyRequested = state.friendRequests.some((request) => request.fromId === state.currentUser.id && request.toId === targetId);
        if (alreadyRequested) {
          state.authMessage = `Friend request already sent to ${targetUser.name}.`;
          render();
          return;
        }
        state.friendRequests = [...state.friendRequests, { id: createId('friend'), fromId: state.currentUser.id, toId: targetId, name: state.currentUser.name }];
        state.authMessage = `Friend request sent to ${targetUser.name}.`;
        persist();
        render();
      }

      function acceptFriendRequest(requestId) {
        const request = state.friendRequests.find((item) => item.id === requestId);
        if (!request) return;
        state.friends = [...new Set([...state.friends, request.fromId, request.toId])];
        state.friendRequests = state.friendRequests.filter((item) => item.id !== requestId);
        state.authMessage = `You are now friends with ${request.name}.`;
        persist();
        render();
      }

      function declineFriendRequest(requestId) {
        state.friendRequests = state.friendRequests.filter((item) => item.id !== requestId);
        state.authMessage = 'Friend request declined.';
        persist();
        render();
      }

      function closeGroupModal() {
        state.groupModalOpen = false;
        state.groupName = '';
        state.selectedGroupMembers = [];
        render();
      }

      function handleDetectiveAccess() {
        if (state.detectiveMode) {
          state.detectiveMode = false;
          state.impersonatedUserId = null;
          state.authMessage = 'Detective mode disabled.';
          render();
          return;
        }
        const password = window.prompt('Enter detective password');
        if (password === 'snake') {
          state.detectiveMode = true;
          state.impersonatedUserId = state.currentUser.id;
          state.authMessage = 'Detective mode enabled.';
          render();
        } else {
          state.authMessage = 'Incorrect password.';
          render();
        }
      }

      function handleDeleteMessage(messageId) {
        if (!state.activeRoomKey) return;
        state.conversations[state.activeRoomKey] = (state.conversations[state.activeRoomKey] || []).filter((message) => message.id !== messageId);
        state.authMessage = 'Message deleted.';
        persist();
        render();
      }

      function openRenameRoomModal(roomKey) {
        const roomMeta = state.roomMeta[roomKey];
        if (!roomMeta || roomMeta.type !== 'group') return;
        state.renameTargetRoomKey = roomKey;
        state.renameDraft = roomMeta.name || 'New group';
        state.renameModalOpen = true;
        render();
      }

      function closeRenameModal() {
        state.renameModalOpen = false;
        state.renameTargetRoomKey = null;
        state.renameDraft = '';
        render();
      }

      function saveRoomRename() {
        const trimmed = state.renameDraft.trim();
        if (!state.renameTargetRoomKey || !trimmed) return;
        state.roomMeta[state.renameTargetRoomKey] = {
          ...(state.roomMeta[state.renameTargetRoomKey] || {}),
          name: trimmed,
        };
        state.authMessage = 'Chat renamed.';
        state.renameModalOpen = false;
        state.renameTargetRoomKey = null;
        state.renameDraft = '';
        persist();
        render();
      }

      function deleteGroupRoom(roomKey) {
        if (!roomKey) return;
        delete state.roomMeta[roomKey];
        delete state.conversations[roomKey];
        state.currentUser.rooms = (state.currentUser.rooms || []).filter((joinedRoomKey) => joinedRoomKey !== roomKey);
        state.users = state.users.map((user) => {
          if (user.id !== state.currentUser.id) return user;
          return { ...user, rooms: (user.rooms || []).filter((joinedRoomKey) => joinedRoomKey !== roomKey) };
        });
        if (state.activeRoomKey === roomKey) {
          const fallbackRoomKey = Object.keys(state.roomMeta).find((key) => state.roomMeta[key]?.type === 'group' || state.roomMeta[key]?.type === 'direct');
          state.activeRoomKey = fallbackRoomKey || null;
        }
        state.activeRoomMenuKey = null;
        state.authMessage = 'Chat removed from your messages.';
        persist();
        render();
      }

      function createGroupChat() {
        if (!state.currentUser) return;
        if (state.selectedGroupMembers.length < 2) {
          state.error = 'Choose at least 2 accounts to start a group chat.';
          render();
          return;
        }
        const roomKey = [state.currentUser.id, ...state.selectedGroupMembers].sort().join('-');
        const cleanedName = state.groupName.trim() || 'New group';
        const memberIds = [state.currentUser.id, ...state.selectedGroupMembers];
        state.roomMeta[roomKey] = {
          type: 'group',
          name: cleanedName,
          memberIds,
        };
        state.conversations[roomKey] = state.conversations[roomKey] || [];
        memberIds.forEach((memberId) => {
          const user = state.users.find((entry) => entry.id === memberId);
          if (user) {
            user.rooms = user.rooms || [];
            if (!user.rooms.includes(roomKey)) {
              user.rooms.push(roomKey);
            }
          }
        });
        state.currentUser.rooms = state.currentUser.rooms || [];
        if (!state.currentUser.rooms.includes(roomKey)) {
          state.currentUser.rooms.push(roomKey);
        }
        state.activeRoomKey = roomKey;
        state.activeContactId = null;
        state.groupModalOpen = false;
        state.groupName = '';
        state.selectedGroupMembers = [];
        state.error = '';
        syncGroupMembershipsToDatabase(roomKey, memberIds);
        persist();
        render();
      }

      function getRoomByKey(roomKey) {
        const contacts = state.users.filter((user) => user.id !== state.currentUser?.id);
        const directRooms = contacts.map((contact) => ({ roomKey: [state.currentUser.id, contact.id].sort().join('-'), type: 'direct', name: contact.name, memberIds: [state.currentUser.id, contact.id], contactId: contact.id }));
        const groupRooms = Object.entries(state.roomMeta)
          .filter(([, meta]) => meta.type === 'group')
          .map(([key, meta]) => ({ roomKey: key, type: 'group', name: meta.name || 'New group', memberIds: meta.memberIds || [], contactId: null }));
        return [...directRooms, ...groupRooms].find((room) => room.roomKey === roomKey) || null;
      }

      function compressImageFile(file, maxWidth = 1200, quality = 0.75) {
        return new Promise((resolve, reject) => {
          const image = new Image();
          const reader = new FileReader();
          reader.onload = () => {
            image.onload = () => {
              const scale = Math.min(1, maxWidth / image.width);
              const width = Math.round(image.width * scale);
              const height = Math.round(image.height * scale);
              const canvas = document.createElement('canvas');
              canvas.width = width;
              canvas.height = height;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(image, 0, 0, width, height);
              canvas.toBlob((blob) => {
                if (!blob) {
                  reject(new Error('Image compression failed'));
                  return;
                }
                resolve(blob);
              }, 'image/jpeg', quality);
            };
            image.onerror = () => reject(new Error('Image load failed'));
            image.src = reader.result;
          };
          reader.onerror = () => reject(new Error('Image read failed')); 
          reader.readAsDataURL(file);
        });
      }

      function uploadImageFile(file, roomKey) {
        if (!firebaseStorage || !state.currentUser) return Promise.reject(new Error('Storage not available'));
        const fileName = `${state.currentUser.id}-${Date.now()}-${file.name.replace(/[^a-zA-Z0-9.-]/g, '_')}`;
        const storageRef = firebaseStorage.ref(`images/${roomKey}/${fileName}`);
        return storageRef.put(file).then((snapshot) => snapshot.ref.getDownloadURL());
      }

      function getRoomPageState(roomKey) {
        if (!roomPageState[roomKey]) {
          roomPageState[roomKey] = { limit: 100, loadingOlder: false, hasMore: true, earliestLoadedAt: null };
        }
        return roomPageState[roomKey];
      }

      function normalizeRoomMessage(snapshot) {
        const value = snapshot.val();
        if (!value) return null;
        const message = { ...value, id: value.id || snapshot.key };
        const timestamp = typeof message.createdAt === 'number' ? message.createdAt : Date.parse(message.createdAt || '') || message.localCreatedAt || Date.now();
        message.createdAt = Number.isFinite(timestamp) ? timestamp : Date.now();
        return message;
      }

      function ensureRoomMessageState(roomKey) {
        roomMessageIds[roomKey] = roomMessageIds[roomKey] || new Set();
        if (!state.conversations[roomKey]) {
          state.conversations[roomKey] = [];
        }
      }

      function insertRoomMessage(roomKey, message) {
        if (!message || !message.id) return false;
        ensureRoomMessageState(roomKey);
        const messages = state.conversations[roomKey] || [];
        if (roomMessageIds[roomKey].has(message.id) || messages.some((entry) => entry.id === message.id)) {
          return false;
        }
        roomMessageIds[roomKey].add(message.id);
        messages.push(message);
        messages.sort((a, b) => a.createdAt - b.createdAt);
        state.conversations[roomKey] = messages;
        const pageState = getRoomPageState(roomKey);
        pageState.earliestLoadedAt = messages[0]?.createdAt || pageState.earliestLoadedAt;
        if (messages.length < pageState.limit) {
          pageState.hasMore = true;
        }
        persist();
        return true;
      }

      function buildMessageRow(message) {
        const mine = message.senderId === state.currentUser.id;
        const sender = state.users.find((user) => user.id === message.senderId);
        const senderLabel = sender?.name || 'Unknown account';
        return `<div class="message-row ${mine ? 'mine' : ''}" data-message-id="${message.id}"><div class="bubble ${mine ? 'mine' : ''}">${!mine ? `<div class="sender-name">${senderLabel}</div>` : ''}${message.text ? `<p>${message.text}</p>` : ''}${message.image ? `<img src="${message.image}" alt="Shared content">` : ''}<div class="bubble-footer"><span>${formatTime(message.createdAt)}</span></div></div></div>`;
      }

      function appendMessageToDOM(message, roomKey) {
        if (roomKey !== state.activeRoomKey) return;
        const messageList = document.querySelector('.message-list');
        if (!messageList || !message.id) return;
        if (messageList.querySelector(`[data-message-id="${message.id}"]`)) return;
        const shouldScroll = isScrolledToBottom(messageList);
        messageList.insertAdjacentHTML('beforeend', buildMessageRow(message));
        if (shouldScroll) {
          messageList.scrollTop = messageList.scrollHeight;
        }
      }

      function renderActiveRoomMessages() {
        const messageList = document.querySelector('.message-list');
        if (!messageList || !state.activeRoomKey) return;
        const messages = state.conversations[state.activeRoomKey] || [];
        messageList.innerHTML = messages.map((message) => buildMessageRow(message)).join('');
        messageList.scrollTop = messageList.scrollHeight;
      }

      function stopRoomMessageListener(roomKey) {
        if (!roomKey || !roomMessageListeners[roomKey]) return;
        const listener = roomMessageListeners[roomKey];
        listener.query.off('child_added', listener.childAdded);
        listener.query.off('child_removed', listener.childRemoved);
        delete roomMessageListeners[roomKey];
      }

      function startRoomMessageListener(roomKey, limit = 100) {
        if (!firebaseDatabase || !roomKey) return;
        stopRoomMessageListener(roomKey);
        const pageState = getRoomPageState(roomKey);
        pageState.limit = limit;
        ensureRoomMessageState(roomKey);
        const query = firebaseDatabase.ref(`conversations/${roomKey}`).orderByChild('createdAt').limitToLast(limit);
        const childAdded = (snapshot) => {
          const message = normalizeRoomMessage(snapshot);
          if (!message) return;
          if (!insertRoomMessage(roomKey, message)) return;
          appendMessageToDOM(message, roomKey);
        };
        const childRemoved = (snapshot) => {
          const messageId = snapshot.key;
          if (!messageId) return;
          if (state.conversations[roomKey]) {
            state.conversations[roomKey] = state.conversations[roomKey].filter((message) => message.id !== messageId);
          }
          const messageList = document.querySelector('.message-list');
          if (roomKey === state.activeRoomKey && messageList) {
            const element = messageList.querySelector(`[data-message-id="${messageId}"]`);
            if (element) {
              element.remove();
            }
          }
        };
        query.on('child_added', childAdded);
        query.on('child_removed', childRemoved);
        roomMessageListeners[roomKey] = { query, childAdded, childRemoved };
      }

      function loadOlderRoomMessages(roomKey, count = 50) {
        if (!firebaseDatabase || !roomKey) return;
        const pageState = getRoomPageState(roomKey);
        if (pageState.loadingOlder || !pageState.hasMore) return;
        pageState.loadingOlder = true;
        const messages = state.conversations[roomKey] || [];
        const oldest = messages[0];
        if (!oldest) {
          pageState.loadingOlder = false;
          pageState.hasMore = false;
          return;
        }
        const query = firebaseDatabase.ref(`conversations/${roomKey}`).orderByChild('createdAt').endAt(oldest.createdAt - 1).limitToLast(count);
        query.once('value', (snapshot) => {
          const loaded = [];
          snapshot.forEach((child) => {
            const message = normalizeRoomMessage(child);
            if (message && !roomMessageIds[roomKey]?.has(message.id)) {
              loaded.push(message);
            }
          });
          loaded.sort((a, b) => a.createdAt - b.createdAt);
          if (loaded.length > 0) {
            ensureRoomMessageState(roomKey);
            state.conversations[roomKey] = [...loaded, ...(state.conversations[roomKey] || [])];
            loaded.forEach((message) => roomMessageIds[roomKey].add(message.id));
            pageState.earliestLoadedAt = state.conversations[roomKey][0]?.createdAt || pageState.earliestLoadedAt;
            if (loaded.length < count) {
              pageState.hasMore = false;
            }
            if (roomKey === state.activeRoomKey) {
              render();
            }
          } else {
            pageState.hasMore = false;
          }
          pageState.loadingOlder = false;
        });
      }

      function ensureMessageListScrollHandler() {
        if (messageListScrollHandler) return messageListScrollHandler;
        messageListScrollHandler = function () {
          const messageList = document.querySelector('.message-list');
          if (!messageList || !state.activeRoomKey) return;
          if (messageList.scrollTop > 40) return;
          const pageState = getRoomPageState(state.activeRoomKey);
          if (pageState.loadingOlder || !pageState.hasMore) return;
          loadOlderRoomMessages(state.activeRoomKey);
        };
        return messageListScrollHandler;
      }

      function dataURLToBlob(dataURL) {
        if (!dataURL || !dataURL.includes(',')) return null;
        const [header, base64] = dataURL.split(',');
        const contentType = header.match(/data:(.*);base64/)?.[1] || 'image/jpeg';
        const binary = atob(base64);
        const array = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i += 1) {
          array[i] = binary.charCodeAt(i);
        }
        return new Blob([array], { type: contentType });
      }

      function removeMessageFromDOM(messageId) {
        if (!messageId) return;
        const messageList = document.querySelector('.message-list');
        if (!messageList) return;
        const element = messageList.querySelector(`[data-message-id="${messageId}"]`);
        if (element) {
          element.remove();
        }
      }

      function sendMessage() {
        if (!state.currentUser || state.sendStatus === 'sending') return;
        const draftField = document.getElementById('draft');
        const currentDraft = draftField ? draftField.value : state.draft;
        const roomKey = getActiveRoomKey();
        if (!roomKey) {
          state.error = 'Please select a conversation first.';
          render();
          return;
        }
        const cleanText = currentDraft.trim();
        if (!cleanText && !state.selectedImage) {
          state.error = 'Add a note or choose an image before sending.';
          render();
          return;
        }

        state.sendStatus = 'sending';
        state.sendError = '';
        state.error = '';
        const senderId = state.detectiveMode ? (state.impersonatedUserId || state.currentUser.id) : state.currentUser.id;
        const outgoing = {
          id: createId('msg'),
          senderId,
          text: cleanText,
          image: '',
          createdAt: Date.now(),
          localCreatedAt: Date.now(),
          status: 'pending',
        };

        const roomRef = firebaseDatabase ? firebaseDatabase.ref(`conversations/${roomKey}`) : null;
        ensureRoomMessageState(roomKey);
        roomMessageIds[roomKey].add(outgoing.id);
        state.conversations[roomKey] = [...(state.conversations[roomKey] || []), outgoing];
        setTypingStatus(roomKey, false);
        state.isDraftEditing = false;
        state.draft = '';
        state.selectedImage = '';
        state.selectedImageFile = null;
        render();
        appendMessageToDOM(outgoing, roomKey);
        requestAnimationFrame(() => {
          const draftFieldAfter = document.getElementById('draft');
          if (draftFieldAfter) {
            draftFieldAfter.focus();
          }
        });

        if (!roomRef) {
          state.sendStatus = 'failed';
          state.sendError = 'Firebase database is unavailable. Please refresh.';
          state.conversations[roomKey] = (state.conversations[roomKey] || []).filter((message) => message.id !== outgoing.id);
          removeMessageFromDOM(outgoing.id);
          render();
          return;
        }

        const sendPayload = { ...outgoing };
        const uploadAndSend = (imageFile) => {
          if (!imageFile) {
            sendPayload.image = '';
            sendToFirebase();
            return;
          }
          compressImageFile(imageFile)
            .then((compressedBlob) => uploadImageFile(compressedBlob, roomKey))
            .then((downloadUrl) => {
              sendPayload.image = downloadUrl;
              sendToFirebase();
            })
            .catch((error) => {
              state.sendStatus = 'failed';
              state.sendError = `Image upload failed: ${error.message || 'upload error'}`;
              state.failedMessage = outgoing;
              state.conversations[roomKey] = (state.conversations[roomKey] || []).filter((message) => message.id !== outgoing.id);
              removeMessageFromDOM(outgoing.id);
              render();
            });
        };

        const sendToFirebase = () => {
          sendPayload.status = 'sent';
          const newMessageRef = roomRef.push();
          newMessageRef.set(sendPayload, (error) => {
            if (error) {
              state.sendStatus = 'failed';
              state.sendError = `Message failed to send: ${error.message || 'network error'}`;
              state.failedMessage = outgoing;
              state.conversations[roomKey] = (state.conversations[roomKey] || []).filter((message) => message.id !== outgoing.id);
              removeMessageFromDOM(outgoing.id);
              render();
              return;
            }
            state.sendStatus = 'success';
            state.failedMessage = null;
            state.sendError = '';
            state.error = '';
            render();
          });
        };

        if (state.selectedImageFile) {
          uploadAndSend(state.selectedImageFile);
        } else if (state.selectedImage) {
          const blob = dataURLToBlob(state.selectedImage);
          uploadAndSend(blob);
        } else {
          uploadAndSend(null);
        }
      }

      function handleImageSelect(event) {
        const file = event.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          state.selectedImage = reader.result;
          state.selectedImageFile = file;
          state.isDraftEditing = false;
          render();
          requestAnimationFrame(() => {
            const draftField = document.getElementById('draft');
            if (draftField) {
              draftField.focus();
              draftField.setSelectionRange(draftField.value.length, draftField.value.length);
            }
          });
        };
        reader.readAsDataURL(file);
      }

      bootstrap();
    </script>
  </body>
</html>
